services:
  vote:
    image: dockersamples/examplevotingapp_vote:latest
    container_name: phan3_bai05_vote
    depends_on:
      - redis
    ports:
      - "5000:80"
    networks:
      - frontend
      - backend

  result:
    image: dockersamples/examplevotingapp_result:latest
    container_name: phan3_bai05_result
    depends_on:
      - db
    ports:
      - "5001:80"
    networks:
      - frontend
      - backend

  worker:
    image: dockersamples/examplevotingapp_worker:latest
    container_name: phan3_bai05_worker
    depends_on:
      - redis
      - db
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: phan3_bai05_redis
    networks:
      - backend

  db:
    image: postgres:16-alpine
    container_name: phan3_bai05_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  db_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
