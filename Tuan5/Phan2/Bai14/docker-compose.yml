services:
  web:
    image: nginx:alpine
    container_name: bai14_web
    networks:
      - private_net

  client:
    image: alpine:latest
    container_name: bai14_client
    command: sh -c "apk add --no-cache curl && sleep infinity"
    depends_on:
      - web
    networks:
      - private_net

networks:
  private_net:
    driver: bridge
