<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Website with Nginx</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 600px;
      }
      h1 {
        color: #333;
        font-size: 2.5em;
        margin: 0 0 20px 0;
      }
      p {
        color: #666;
        font-size: 1.1em;
        margin: 10px 0;
      }
      .info {
        background: #f0f0f0;
        padding: 20px;
        border-radius: 5px;
        margin-top: 20px;
      }
      .info strong {
        color: #667eea;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, Nginx Docker!</h1>
      <p>This is a static website served by Nginx in Docker</p>
      <div class="info">
        <p><strong>Base Image:</strong> nginx:latest</p>
        <p><strong>Port:</strong> 80</p>
        <p><strong>Status:</strong> Running Successfully ✓</p>
      </div>
    </div>
  </body>
</html>
